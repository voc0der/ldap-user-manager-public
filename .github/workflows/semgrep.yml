name: Semgrep Security Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Mondays at 12:00 UTC
    - cron: '0 12 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    name: Scan Code
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Findings are published to the Security tab (code scanning) rather than
      # failing the job, so the SARIF upload below always gets to run.
      # Actions are referenced by version tag on purpose, not pinned to SHAs.
      - name: Run Semgrep
        run: >-
          semgrep scan
          --config=auto
          --config=p/security-audit
          --config=p/php
          --config=p/javascript
          --config=p/command-injection
          --config=p/sql-injection
          --config=p/xss
          --exclude-rule=yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag
          --sarif --output=semgrep.sarif

      # Semgrep keeps nosemgrep-suppressed findings in its SARIF (marked as
      # suppressed), but code scanning still opens alerts for them.
      - name: Drop suppressed findings from SARIF
        if: always()
        shell: python3 {0}
        run: |
          import json

          path = 'semgrep.sarif'
          with open(path) as f:
              sarif = json.load(f)
          for run in sarif.get('runs', []):
              run['results'] = [r for r in run.get('results', []) if not r.get('suppressions')]
          with open(path, 'w') as f:
              json.dump(sarif, f)

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
